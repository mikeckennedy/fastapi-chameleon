# Great Docs configuration for fastapi-chameleon.
# See https://posit-dev.github.io/great-docs/user-guide/configuration.html

# Import name == distribution name (fastapi_chameleon), so `module:` is not needed.
display_name: FastAPI Chameleon

# Pin the docstring style; this package uses Sphinx-style (:param:/:return:).
parser: sphinx

# Use runtime introspection for accurate signatures (the package imports cleanly).
dynamic: true

# Subpath hosting: drives Quarto's base path so CSS/JS/nav resolve under the
# subdirectory. Keep the trailing slash.
site_url: "https://mkennedy.codes/docs/fastapi-chameleon/"

# GOTCHA G7: the sitemap/robots/canonical/og:url base URL is detected separately
# (defaults to the GitHub Pages URL) and does NOT fall back to site_url. Pin it here
# so the sitemap points at mkennedy.codes instead of github.io.
seo:
  canonical:
    base_url: "https://mkennedy.codes/docs/fastapi-chameleon/"

# Source repository + "view source" links. PKG_DIR == GIT_ROOT here, so the generated
# GitHub links are already correct (the G6 source-link fix is NOT needed).
repo: https://github.com/mikeckennedy/fastapi-chameleon
github_style: widget
source:
  enabled: true
  branch: main
  placement: usage

# Link to the PyPI project page.
pypi: true

# GOTCHA G5: mcp.enabled defaults to true, which renders an empty "MCP" tab even with no
# MCP server. This project ships no MCP server, so disable it.
mcp:
  enabled: false

# Umami analytics — merged into Quarto's format.html.include-in-header, so it lands in
# the <head> of every generated page.
include_in_header:
  - text: |
      <script async src="https://uma.mkennedy.codes/script.js" data-website-id="fc9b6770-3b44-4073-944e-4a4f0e79f66a"></script>

skill:
  # Hand-written prose injected into the generated skill body — things the API
  # signatures can't convey. Adapted from the fastapi-chameleon_reference.md agent guide.
  extra_body: skill_extra_body.md
  gotchas:
    - "global_init() is one-shot by default: with cache_init=True, later calls are silently ignored. Pass cache_init=False or call fastapi_chameleon.engine.clear() to re-initialize."
    - "The bare @template form resolves the template file name once, at decoration time — if global_init() hasn't run yet, the folder silently defaults to 'templates' relative to the CWD and a later global_init() won't re-resolve it."
    - "Decorated views must return a dict (the template model) or a fastapi.Response; any other return type raises FastAPIChameleonException at request time."
    - "The decorator keyword is mimetype (not content_type), and @template has no status_code parameter — use response() when you need a non-200 status."
    - "Error pages from not_found()/generic_error() always render as text/html at their own status; the decorator's mimetype does not apply."
    - "not_found() renders the 404 template with an empty model; only generic_error() can pass template_data into the error template."
    - "not_found()/generic_error() only work below a @template-decorated view — from an undecorated route or middleware the exception goes unhandled and FastAPI returns a 500."
  best_practices:
    - "Call global_init(template_folder, auto_reload=dev_mode) exactly once at app startup, before view modules are imported/registered."
    - "Put the route decorator outermost: @app.get(...) above @fastapi_chameleon.template(...), which sits directly on the view function."
    - "Return plain dicts from views; return a fastapi.Response only for redirects and other pass-through cases."
    - "Enable auto_reload only during development so templates stay cached in production."
    - "Use fastapi_chameleon.response() where the decorator doesn't fit — custom status codes, non-HTML mimetypes, or rendering outside a view."
  decision_table:
    - need: "Render a Chameleon template from a FastAPI view (sync or async)"
      use: "@fastapi_chameleon.template('home/index.pt') on the view function"
    - need: "Return a friendly HTML 404 page instead of FastAPI's JSON default"
      use: "fastapi_chameleon.not_found()"
    - need: "Render any error template with any status code (optionally with data)"
      use: "fastapi_chameleon.generic_error(template_file, status_code, template_data={...})"
    - need: "Build a rendered Response with a custom status code or mimetype"
      use: "fastapi_chameleon.response(template_file, mimetype=..., status_code=..., **model)"
    - need: "Redirect (or return JSON) from a decorated view"
      use: "return a fastapi.Response subclass — the template is skipped"
    - need: "Get rendered HTML as a plain string"
      use: "fastapi_chameleon.engine.render(template_file, **model)"

# Author metadata for the landing-page sidebar.
authors:
  - name: Michael Kennedy
    role: Author
    email: michael@talkpython.fm
    github: mikeckennedy

# Jupyter kernel for executing any code cells in generated pages.
jupyter: python3

# API reference structure. Sections group the public API by task; each function/class is
# referenced by name (the 5 __all__ exports) or full path (the exception classes, which
# are public but not re-exported at the top level).
reference:
  title: "API Reference"
  desc: "Everything fastapi-chameleon exposes: the template decorator, app setup, error helpers, and the exception types."
  sections:
    - title: Setup
      desc: "Point the library at your Chameleon templates folder once at app startup."
      contents:
        - global_init
    - title: Rendering views
      desc: "Decorate FastAPI view functions to render templates, or build a response directly."
      contents:
        - template
        - response
    - title: Error responses
      desc: "Short-circuit a view to render a friendly error page with the right status code."
      contents:
        - not_found
        - generic_error
    - title: Exceptions
      desc: "Exception types raised by the library (the error helpers raise these internally)."
      contents:
        # Paths are relative to the package root (resolved as fastapi_chameleon:<entry>).
        - exceptions.FastAPIChameleonException
        - exceptions.FastAPIChameleonNotFoundException
        - exceptions.FastAPIChameleonGenericException
