# [ruff]
line-length = 120
format.quote-style = "single"

# Ruff 0.17+ includes "*.md" by default and formats the code blocks inside Markdown. That would rewrap the
# README and SKILL.md snippets and flag the generated docs/ mirror, so only Python (and notebooks/config) is
# included here.
include = ["*.py", "*.pyi", "*.pyw", "*.ipynb", "**/pyproject.toml", "**/ruff.toml", "**/.ruff.toml"]

# Enable Pyflakes `E` and `F` codes by default.
lint.select = ["E", "F"]
lint.ignore = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "docs",
    "great-docs",
    "node_modules",
    ".env",
    ".venv",
    "venv",
]
lint.per-file-ignores = {}

# Allow unused variables when underscore-prefixed.
# dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Assume Python 3.13.
target-version = "py313"

#[tool.ruff.mccabe]
## Unlike Flake8, default to a complexity level of 10.
lint.mccabe.max-complexity = 10
